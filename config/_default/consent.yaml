items:
  - title: Google Analytics (functional)
    description: >
      Analytics is provided via Google Analytics (GA4) using the official gtag.js CDN.
      No local script files are used to ensure reliability and compatibility.
    is_functional: true

  - title: Crisp Chat
    description: >
      Chat support is provided via Crisp's official embed script loaded from their CDN.
      This allows real-time messaging without storing local scripts.
    is_functional: false